[project]
name = "oc-memory"
version = "2.0.0"
description = "Persistent memory MCP server for Claude Code, Cursor, and OpenClaw — SQLite, FTS5, ONNX embeddings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "onnxruntime>=1.17.0",
    "tokenizers>=0.15.0",
    "mcp>=1.0.0",
    "uvicorn>=0.29.0",
    "starlette>=0.37.0",
    "anyio>=4.0.0",
]

[project.optional-dependencies]
ollama = [
    "httpx>=0.27.0",
]
drive = [
    "google-api-python-client>=2.0",
    "google-auth-httplib2>=0.1",
    "google-auth-oauthlib>=0.5",
]
multi-user = []  # No extra deps — enables owner_id/visibility per cell and OC_MEMORY_ADMIN_USER bypass
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
oc-memory = "oc_memory.cli:main"
oc-memory-mcp = "oc_memory.mcp_server:main_stdio"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["oc_memory*"]

[tool.ruff]
line-length = 100
