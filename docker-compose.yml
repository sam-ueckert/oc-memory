services:
  oc-memory:
    build: .
    ports:
      - "8765:8765"
    volumes:
      - oc_memory_data:/data
    environment:
      - MCP_TRANSPORT=http
      - MCP_PORT=8765
      # Streamable HTTP endpoint (modern, recommended):  http://localhost:8765/mcp
      # Legacy SSE endpoint (deprecated, old clients):   http://localhost:8765/sse
      # Health check:                                     http://localhost:8765/health

      # Optional: use Ollama for embeddings instead of built-in ONNX
      # - OC_MEMORY_BACKEND=ollama
      # - OLLAMA_URL=http://host.docker.internal:11434
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  oc_memory_data:
