---
apiVersion: v1
kind: Namespace
metadata:
  name: oc-memory

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: memory-db-pvc
  namespace: oc-memory
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-server
  namespace: oc-memory
  labels:
    app: memory-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-server
  template:
    metadata:
      labels:
        app: memory-server
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-pi
      containers:
        - name: memory-server
          image: oc-memory:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8765
              name: mcp-sse
          env:
            - name: MCP_TRANSPORT
              value: "http"
            - name: MCP_PORT
              value: "8765"
            - name: OC_MEMORY_DB
              value: "/data/memory.db"
            - name: OC_MEMORY_EXPORT
              value: "/data/export"
          volumeMounts:
            - name: memory-data
              mountPath: /data
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8765
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8765
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: memory-data
          persistentVolumeClaim:
            claimName: memory-db-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: memory-server
  namespace: oc-memory
spec:
  type: NodePort
  selector:
    app: memory-server
  ports:
    - name: mcp-sse
      port: 8765
      targetPort: 8765
      nodePort: 30765
